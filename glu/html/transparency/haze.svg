  <g fill="#ffffff">
    <text x="42" y="526" font-size="11" font-weight="bold">Transparency in SVG</text>
    <text x="42" y="542" font-size="8" fill-opacity=".85">Fog: stop-opacity, painted as soft masks.  Sun and stars: fill-opacity, a constant alpha.</text>
