<svg xmlns="http://www.w3.org/2000/svg" width="420pt" height="594pt" viewBox="0 0 420 594">
  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="404">
      <stop offset="0" stop-color="#17133a"/>
      <stop offset=".38" stop-color="#4b2570"/>
      <stop offset=".68" stop-color="#d4556a"/>
      <stop offset=".9" stop-color="#ffb066"/>
      <stop offset="1" stop-color="#ffd9a0"/>
    </linearGradient>
    <linearGradient id="water" gradientUnits="userSpaceOnUse" x1="0" y1="404" x2="0" y2="594">
      <stop offset="0" stop-color="#e9a07c"/>
      <stop offset=".3" stop-color="#7c3d72"/>
      <stop offset="1" stop-color="#120f30"/>
    </linearGradient>

    <!-- The stops differ in opacity, which needs a soft mask. -->
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="404" x2="0" y2="564">
      <stop offset="0" stop-color="#120f30" stop-opacity="0"/>
      <stop offset="1" stop-color="#120f30" stop-opacity="1"/>
