      <stop offset=".85" stop-color="#ffe4c8" stop-opacity=".65"/>
      <stop offset="1" stop-color="#ffe4c8" stop-opacity="0"/>
    </linearGradient>

    <!-- Fog rises from the foot of each ridge and thins out upwards. -->
    <linearGradient id="fog0" gradientUnits="userSpaceOnUse" x1="0" y1="252" x2="0" y2="326">
      <stop offset="0" stop-color="#ffd2b0" stop-opacity="0"/>
