<!DOCTYPE html>
<!--
  A poster drawn as one SVG file. Fog, glow, reflection and water use the
  ways SVG offers to make something transparent, and all of them end up
  as PDF transparency. Nothing is rasterized.

  Run:  glu transparency.html
-->
<html lang="en">
<head>
  <title>Haze</title>
  <style>
    @page { size: 420pt 594pt; margin: 0; }
    body  { margin: 0; }
    img   { width: 100%; }
  </style>
</head>
<body>
  <img src="haze.svg" alt="A lake at dusk: the word HAZE stands behind mountain ridges and sinks into the fog, the ridges and trees reflect in the water.">
</body>
</html>
